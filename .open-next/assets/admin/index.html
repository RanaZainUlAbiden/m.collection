<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | Marjaan Collection</title>
  <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />
  <link rel="icon" href="/IMG_9226.PNG" />
  <style>
    /* ─── Loading Screen ─────────────────────────── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #faf8f6;
    }
    .cms-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      gap: 24px;
      background: linear-gradient(135deg, #fbf7f4 0%, #f2e6de 100%);
    }
    .cms-loading .logo {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .cms-loading .logo img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    .cms-loading h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.5px;
    }
    .cms-loading p {
      color: #888;
      font-size: 14px;
      font-weight: 400;
    }
    .cms-loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e5b9b5;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

  </style>
</head>
<body>
  <div id="nc-root"></div>

  <!-- Loading indicator shown until Decap CMS loads -->
  <div class="cms-loading" id="cms-loading">
    <div class="logo">
      <img src="/IMG_9226.PNG" alt="Marjaan Collection" />
    </div>
    <h1>Marjaan Collection</h1>
    <div class="spinner"></div>
    <p>Loading Admin Panel...</p>
  </div>

  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Hide loading indicator once CMS is ready -->
  <script>
    window.addEventListener('load', function() {
      var loading = document.getElementById('cms-loading');
      if (loading) {
        // Give CMS a moment to mount
        setTimeout(function() {
          loading.style.display = 'none';
        }, 1500);
      }
    });
  </script>
</body>
</html>
